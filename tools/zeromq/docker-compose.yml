# Compose file for ZeroMQ
services:
  zeromq:
    image: zeromq/zeromq:latest
    container_name: zeromq
    ports:
      - "5555:5555"
      - "5556:5556"
    environment:
      - ZMQ_PUBLISHER_PORT=5555
      - ZMQ_SUBSCRIBER_PORT=5556
    volumes:
      - zeromq_data:/var/lib/zeromq
    restart: always
    healthcheck:
      test: ["CMD", "zmq_check", "-p", "5555"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  zeromq_data:
